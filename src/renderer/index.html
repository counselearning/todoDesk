<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoDesk - Markdown Todo Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 標題列 -->
    <header class="header">
      <h1>📋 TodoDesk</h1>
      <p class="subtitle">Markdown Todo Dashboard</p>
    </header>

    <!-- 工具列 -->
    <div class="toolbar">
      <button id="selectDirBtn" class="btn btn-primary">
        📁 選擇資料夾
      </button>
      <div id="currentDir" class="current-dir">
        <span class="label">當前資料夾:</span>
        <span id="dirPath" class="path">未選擇</span>
      </div>
      <button id="refreshBtn" class="btn btn-secondary">
        🔄 重新整理
      </button>
    </div>

    <!-- 過濾器 -->
    <div class="filters">
      <div class="filter-group">
        <label>
          <input type="checkbox" id="filterCompleted" checked>
          顯示已完成
        </label>
        <label>
          <input type="checkbox" id="filterIncomplete" checked>
          顯示未完成
        </label>
      </div>
      <div class="filter-group">
        <input type="text" id="searchInput" placeholder="🔍 搜尋 todos...">
      </div>
      <div class="filter-group">
        <select id="sortBy">
          <option value="date">依日期排序</option>
          <option value="file">依檔案排序</option>
          <option value="status">依狀態排序</option>
        </select>
      </div>
    </div>

    <!-- 統計資訊 -->
    <div class="stats">
      <div class="stat-item">
        <span class="stat-value" id="totalTodos">0</span>
        <span class="stat-label">總計</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="completedTodos">0</span>
        <span class="stat-label">已完成</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="incompleteTodos">0</span>
        <span class="stat-label">未完成</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="overdueTodos">0</span>
        <span class="stat-label">已逾期</span>
      </div>
    </div>

    <!-- Todo 列表 -->
    <div class="todos-container">
      <div id="todosList" class="todos-list">
        <div class="empty-state">
          <p>👆 請選擇一個包含 Markdown 檔案的資料夾開始使用</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 編輯對話框 -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>編輯 Todo</h2>
      <textarea id="editText" rows="3"></textarea>
      <div class="modal-actions">
        <button id="saveEditBtn" class="btn btn-primary">儲存</button>
        <button id="cancelEditBtn" class="btn btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
